services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      GAME_COLLECTION_EXPORT_KEY: ${GAME_COLLECTION_EXPORT_KEY:-}
      QUIZ_COLLECTION_EXPORT_KEY: ${QUIZ_COLLECTION_EXPORT_KEY:-}
      # ML predictions are on by default (set false in .env to turn off). The
      # two model files are committed under ./local_ml_artifacts; the rest of
      # that folder is git-ignored private research data.
      QUIZ_ML_ENABLED: ${QUIZ_ML_ENABLED:-true}
      GAME_ML_EXPERIMENTAL_ENABLED: ${GAME_ML_EXPERIMENTAL_ENABLED:-true}
      GAME_ML_MODEL_ARCHIVE: /local_ml_artifacts/game_ml_model_export_with_fixtures.zip
      GAME_ML_PYTHON: /opt/game-ml/bin/python
      GAME_ML_CONTAINER_NETWORK: "true"

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app
      # Quiz reads <project root>/local_ml_artifacts, which is / inside the container.
      - ./local_ml_artifacts:/local_ml_artifacts:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      # Docker runs use the released teacher-approved dynamic Quiz bank (and its
      # M1–M4 prediction). The code default stays fixed; set
      # VITE_QUIZ_BANK_MODE=fixed in .env for the original ten questions.
      VITE_QUIZ_BANK_MODE: ${VITE_QUIZ_BANK_MODE:-dynamic}

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
